name: Deploy auf GitHub Pages

on:
  push:
    branches: ["main"]

# Erlaubt GitHub Actions, die Webseite auf GitHub Pages hochzuladen
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt bauen
        run: npm run build

      # NEU: Den gebauten 'dist'-Ordner für GitHub Pages vorbereiten
      - name: Build-Ordner hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      # NEU: Die Webseite im Internet veröffentlichen
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
