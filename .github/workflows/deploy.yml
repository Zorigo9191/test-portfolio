name: Build und Test

# Der Workflow startet jedes Mal, wenn du etwas in den 'main' Branch pushst
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Code von GitHub auschecken
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Node.js installieren (wichtig für Vite/Tailwind)
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3. Abhängigkeiten (node_modules) installieren
      - name: Abhängigkeiten installieren
        run: npm ci

      # 4. Das Projekt bauen (erstellt den 'dist' Ordner)
      - name: Projekt bauen
        run: npm run build
